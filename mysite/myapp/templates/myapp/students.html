<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <!-- Bootstrap -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">My Django App</a>
            <div>
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/about/">About</a>
                <a class="nav-link text-white" href="/students/">Students</a>
                <a class="nav-link text-white" href="/add-student/">Add Student</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card p-4 shadow-lg rounded-4 border-0">
            <h1 class="text-center text-primary mb-4">Registered Students</h1>

            <table class="table table-striped table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Level</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.department }}</td>
                        <td>{{ student.level }}</td>
                        <td>
                            <a href="{% url 'edit_student' student.id %}">Edit</a>
                        </td>
                        <td>
                            <a href="{% url 'dels' student.id %}">Delete</a>
                        </td>

                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center text-muted">No students found.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
