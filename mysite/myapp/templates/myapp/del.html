<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-3">
            <h3 class="fw-bold text-danger">Delete Student</h3>
        </div>

        <p class="text-center">Are you sure you want to delete:</p>

        <h5 class="text-center mb-4">
            {{ student.name }}  
            <br>
            <small class="text-muted">{{ student.department }}</small>
        </h5>

        <form method="POST" class="d-grid gap-2">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger btn-lg">
                Yes, Delete
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'students' %}" class="btn btn-secondary w-100">Cancel</a>
        </div>
    </div>

</div>

</body>
</html>
