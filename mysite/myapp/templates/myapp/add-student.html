<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">My Django App</a>
            <div>
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/about/">About</a>
                <a class="nav-link text-white" href="/students/">Students</a>
                <a class="nav-link text-white" href="/add-student/">Add Student</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card p-4 shadow-lg border-0 rounded-4">
            <h1 class="text-primary text-center mb-4">Add New Student</h1>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    {{ form.name }} 
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    {{ form.department }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Level</label>
                    {{ form.level }}
                </div>

                <button type="submit" class="btn btn-success w-100">Add Student</button>
            </form>

            <a href="/students/" class="btn btn-outline-primary mt-3 w-100">Back to Students List</a>
        </div>
    </div>

    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
