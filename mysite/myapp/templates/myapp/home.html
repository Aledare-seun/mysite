<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Django Bootstrap Page</title>

    <!-- ✅ Bootstrap 5 CSS (from CDN) -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <!-- Optional: Bootstrap Icons -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" 
      rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ✅ Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">My Django App</a>
            <a class="nav-link text-white" href="/about/">About</a>
            <a class="nav-link text-white" href="/students/">Students</a>
            <a class="nav-link text-white" href="/add/">Add Student</a>

        </div>
    </nav>

    <!-- ✅ Page Content -->
    <div class="container mt-5 text-center">
        <div class="card shadow-lg p-4 rounded-4 border-0">
            <h1 class="text-primary">Hello, {{ name }}! 🎉</h1>
            <p class="lead text-secondary">{{ message }}</p>
            <form action="{% url 'log_in' %}" method="post" class="mb-2">
                {% csrf_token %}
                <button class="btn btn-success mt-3">
                    <i class="bi bi-rocket"></i> Login
                </button>
            </form>
            
        </div>
    </div>

    <!-- ✅ Bootstrap JS (optional for interactions) -->
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
