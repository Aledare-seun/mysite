<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #d0e8ff, #ffffff);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: none;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px;
        }
        label {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary py-3">
        <div class="container">
            <a class="navbar-brand" href="/">My Django App</a>

            <div class="d-flex gap-3">
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/about/">About</a>
                <a class="nav-link text-white" href="/students/">Students</a>
            </div>
        </div>
    </nav>

    <!-- MAIN CARD -->
    <div class="container d-flex justify-content-center mt-5">
        <div class="card glass-card p-5 col-md-6">
            
            <h2 class="text-center text-primary fw-bold mb-4">
                <i class="bi bi-person-plus-fill"></i> Add New Student
            </h2>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter student name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-control" placeholder="Enter department" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Level</label>
                    <input type="text" name="level" class="form-control" placeholder="Enter level" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill">
                    <i class="bi bi-check-circle-fill"></i> Add Student
                </button>
            </form>

            <a href="/students/" 
               class="btn btn-outline-primary mt-3 w-100 py-2 rounded-pill">
                <i class="bi bi-arrow-left-circle"></i> Back to Students List
            </a>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link 
      rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</body>
</html>
