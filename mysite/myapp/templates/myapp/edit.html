<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h3 class="text-center mb-4 fw-bold">Edit Student</h3>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ student.department }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Level</label>
                            <input type="text" name="level" class="form-control" value="{{ student.level }}" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Update</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'students' %}" class="btn btn-secondary w-100">Back to List</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
